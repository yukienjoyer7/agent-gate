services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: agentgate-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: agentgate
      POSTGRES_USER: agentgate
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agentgate}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgate"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - agentgate-network

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: agentgate-api
    restart: unless-stopped

    # Uses .env as the active config. For local development:
    #   cp .env.development .env
    env_file:
      - .env
    # Override DATABASE_URL for Docker networking (service name, not localhost)
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://agentgate:agentgate@postgres:5432/agentgate}
      # Ollama runs on the developer host when using Docker Desktop.
      GUARDRAIL_BACKEND: ${GUARDRAIL_BACKEND:-agentgate}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      AGENTGATE_LLM_DETECTOR_MODEL: ${AGENTGATE_LLM_DETECTOR_MODEL:-qwen2.5:7b}
      AGENTGATE_LLM_DETECTOR_TIMEOUT: ${AGENTGATE_LLM_DETECTOR_TIMEOUT:-30}
      AGENTGATE_DETECTOR_ARCHITECTURE: ${AGENTGATE_DETECTOR_ARCHITECTURE:-six}

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      postgres:
        condition: service_healthy

    user: "1000:1000"

    networks:
      - agentgate-network

volumes:
  postgres_data:

networks:
  agentgate-network:
    driver: bridge
    internal: false
