services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: agentgate-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: agentgate
      POSTGRES_USER: agentgate
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agentgate}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgate"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - agentgate-network

  redis:
    image: redis:7.4-alpine
    container_name: agentgate-redis
    restart: unless-stopped

    command: ["redis-server", "--appendonly", "no", "--save", ""]

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - agentgate-network

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: agentgate-api
    restart: unless-stopped

    # Uses .env as the active config. For local development:
    #   cp .env.development .env
    env_file:
      - .env
    # Host-run settings in .env must not select the container database endpoint.
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg://agentgate:${DB_PASSWORD:-agentgate}@postgres:5432/agentgate}
      # Ollama runs on the host; the gateway mapping below also supports Linux.
      GUARDRAIL_BACKEND: ${GUARDRAIL_BACKEND:-agentgate}
      OLLAMA_HOST: ${DOCKER_OLLAMA_HOST:-http://host.docker.internal:11434}
      AGENTGATE_LLM_DETECTOR_MODEL: ${AGENTGATE_LLM_DETECTOR_MODEL:-qwen2.5:7b}
      AGENTGATE_LLM_FALLBACK_MODEL: ${AGENTGATE_LLM_FALLBACK_MODEL:-gemma-4-E2B-it}
      AGENTGATE_LLM_FALLBACK_ATTEMPTS: ${AGENTGATE_LLM_FALLBACK_ATTEMPTS:-1}
      AGENTGATE_LLM_DETECTOR_TIMEOUT: ${AGENTGATE_LLM_DETECTOR_TIMEOUT:-200}
      AGENTGATE_DETECTOR_ARCHITECTURE: ${AGENTGATE_DETECTOR_ARCHITECTURE:-six}
      AGENTGATE_REDIS_QUEUE_ENABLED: ${AGENTGATE_REDIS_QUEUE_ENABLED:-true}
      AGENTGATE_REDIS_URL: ${AGENTGATE_REDIS_URL:-redis://redis:6379/0}
      AGENTGATE_REDIS_QUEUE_NAME: ${AGENTGATE_REDIS_QUEUE_NAME:-agentgate:guardrail}
      AGENTGATE_REDIS_QUEUE_WAIT_TIMEOUT: ${AGENTGATE_REDIS_QUEUE_WAIT_TIMEOUT:-3600}
      AGENTGATE_REDIS_QUEUE_LEASE_SEC: ${AGENTGATE_REDIS_QUEUE_LEASE_SEC:-660}
      AGENT_RUN_TIMEOUT_SEC: ${AGENT_RUN_TIMEOUT_SEC:-7200}

    # The database health dependency below gates migrations and application startup.
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    user: "1000:1000"

    networks:
      - agentgate-network

volumes:
  postgres_data:

networks:
  agentgate-network:
    driver: bridge
    internal: false
