services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: agentgate-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: agentgate
      POSTGRES_USER: agentgate
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agentgate}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgate"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - agentgate-network

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: agentgate-api
    restart: unless-stopped

    # Uses .env as the active config. For local development:
    #   cp .env.development .env
    env_file:
      - .env
    # Override DATABASE_URL for Docker networking (service name, not localhost)
    environment:
      DATABASE_URL: postgresql+psycopg://agentgate:agentgate@postgres:5432/agentgate

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    depends_on:
      postgres:
        condition: service_healthy

    user: "1000:1000"

    networks:
      - agentgate-network

volumes:
  postgres_data:

networks:
  agentgate-network:
    driver: bridge
    internal: false
