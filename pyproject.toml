[project]
name = "agentgate"
version = "0.1.0"
description = "AgentGate — guarded agent execution platform (MVP)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-json-logger>=2.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "platformdirs>=4.0",
    "filelock>=3.15",
    "keyring>=25.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
agentgate = "app.cli.main:main"

[project.optional-dependencies]
browser = ["playwright>=1.44"]
stripe = [
    "stripe[async]~=15.6.1",
]
server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.29",
    "redis>=5.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.10",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.domains.guardrail._vendor.agentgate" = ["NOTICE.md"]
"app.domains.guardrail._vendor.agentgate.policy" = ["packs/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["app/domains/guardrail/_vendor"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = 'app/domains/guardrail/_vendor/'

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = "app.domains.guardrail._vendor.*"
ignore_errors = true
